<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>Celebrity Look-Alike</title>
    <meta
      name="description"
      content="Upload a photo and see the five celebrities you most resemble. Your photo is never stored."
    />
    <!--
      Dev-harness styling only. This never ships: the microfrontend bundle
      carries its own scoped stylesheet, and everything here belongs to the
      stand-in host page.
    -->
    <style>
      body {
        margin: 0;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        background: #f4f6fa;
        color: #0f172a;
      }
      .devhost {
        max-width: 34rem;
        margin: 0 auto;
        padding: 4rem 1.25rem;
      }
      .devhost h1 {
        font-size: 1.75rem;
      }
      .devhost p {
        color: #64748b;
        line-height: 1.6;
      }
      .devhost-open {
        margin-top: 1rem;
        padding: 0.7rem 1.25rem;
        border: 1px solid #cbd5e1;
        border-radius: 0.5rem;
        background: #ffffff;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #07101e;
          color: #e6edf3;
        }
        .devhost p {
          color: #8b949e;
        }
        .devhost-open {
          background: #1c2128;
          border-color: #30363d;
          color: inherit;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
